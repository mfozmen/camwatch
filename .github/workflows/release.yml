name: Release

# Manual only: run `gh workflow run release.yml` when the maintainer wants a
# release. Python Semantic Release scans the Conventional Commits since the
# last tag and bumps accordingly (feat -> minor, fix/perf -> patch,
# BREAKING CHANGE -> major), writes CHANGELOG.md, tags vX.Y.Z and cuts a draft
# GitHub Release. The app jobs build the Windows setup and signed Android APKs
# (one per ABI, plus universal), each with its .sha256; `attach` uploads them
# and publishes the release once every platform's files are up.
# Config: releaserc.toml.
#
# PSR's own "chore(release): x.y.z [skip ci]" commit is pushed with the
# release deploy key, the only bypass of the ruleset on main.

on:
  workflow_dispatch:
    inputs:
      force:
        description: Force the bump level instead of scanning commits
        required: false
        default: ""
        type: choice
        options: ["", patch, minor, major]
      rebuild:
        description: Rebuild and re-attach the app for an existing tag (e.g. v0.3.0) instead of releasing
        required: false
        default: ""
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    if: github.repository == 'mfozmen/camwatch'
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      released: ${{ steps.rebuild.outputs.released || steps.release.outputs.released }}
      tag: ${{ steps.rebuild.outputs.tag || steps.release.outputs.tag }}
      version: ${{ steps.rebuild.outputs.version || steps.release.outputs.version }}
    steps:
      # A rebuild skips Semantic Release and hands the existing tag to the app jobs.
      - name: Existing tag to rebuild
        id: rebuild
        if: inputs.rebuild != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.rebuild }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
          { echo "released=true"; echo "tag=$TAG"; echo "version=${TAG#v}"; } >> "$GITHUB_OUTPUT"

      # main is protected by a ruleset whose only bypass is a deploy key: the
      # version commit and tag go out over SSH with RELEASE_DEPLOY_KEY. The
      # GitHub Release itself is an API call and uses GITHUB_TOKEN.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: inputs.rebuild == ''
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Python Semantic Release
        id: release
        if: inputs.rebuild == ''
        uses: python-semantic-release/python-semantic-release@b700dbeb1f431a0fcc30a79f3f0869407fe07278  # v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Commit and tag locally only: the action runs in a container that
          # cannot use the checkout's SSH setup, so the push is the next step.
          push: "false"
          vcs_release: "false"
          force: ${{ inputs.force }}
          config_file: releaserc.toml

      # The container ran as root on this checkout; take .git back before pushing.
      # --atomic: the commit and the tag land together or not at all.
      - name: Push the version commit and tag
        if: steps.release.outputs.released == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" .git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git push --atomic origin HEAD:main "refs/tags/$TAG"

      # A draft until `attach` has every platform's files up.
      # Re-runnable: an existing release for the tag is left as it is.
      - name: Create the GitHub Release
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          NOTES: ${{ steps.release.outputs.release_notes }}
        run: gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "$NOTES" --draft

  app-windows:
    name: App (windows)
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    # The build runs pub's and plugins' code: it gets no write token. `attach`
    # uploads what it built.
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Flutter version from the root pubspec, read without yq (windows-latest lacks it)
        id: flutter
        shell: bash
        run: |
          v=$(sed -n 's/^  flutter: *\([0-9.]*\).*/\1/p' pubspec.yaml)
          # No exact pin found: stop, never build on whatever Flutter is newest.
          [[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::no exact Flutter pin in pubspec.yaml"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: false
      - run: flutter pub get --enforce-lockfile
      - name: Build
        working-directory: apps/camwatch
        shell: bash
        run: flutter build windows --release --build-name="$VERSION"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Package
        shell: bash
        run: bash tool/package_desktop.sh "$VERSION" dist Release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: app-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  app-android:
    name: App (android)
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read  # as app-windows: `attach` uploads
    env:
      VERSION: ${{ needs.release.outputs.version }}
      KEYSTORE_BASE64: ${{ secrets.CAMWATCH_ANDROID_KEYSTORE_BASE64 }}
      CAMWATCH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CAMWATCH_ANDROID_KEYSTORE_PASSWORD }}
      CAMWATCH_ANDROID_KEY_PASSWORD: ${{ secrets.CAMWATCH_ANDROID_KEY_PASSWORD }}
      CAMWATCH_ANDROID_KEY_ALIAS: ${{ secrets.CAMWATCH_ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Flutter version from the root pubspec, read without yq (windows-latest lacks it)
        id: flutter
        shell: bash
        run: |
          v=$(sed -n 's/^  flutter: *\([0-9.]*\).*/\1/p' pubspec.yaml)
          # No exact pin found: stop, never build on whatever Flutter is newest.
          [[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::no exact Flutter pin in pubspec.yaml"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          # No restored pub cache next to the signing key: only what the lock pins.
          cache: false
      - run: flutter pub get --enforce-lockfile
      # A debug-signed APK could never be updated by a properly signed one: no key, no release.
      - name: Release key
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::CAMWATCH_ANDROID_KEYSTORE_BASE64 is not set"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CAMWATCH_ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build the signed APKs
        working-directory: apps/camwatch
        # versionCode from the version: 1.2.3 -> 1002003, always increasing.
        run: |
          IFS=. read -r major minor patch <<< "$VERSION"
          args=(--build-name="$VERSION" --build-number=$((major * 1000000 + minor * 1000 + patch)))
          flutter build apk --release --split-per-abi "${args[@]}"
          mkdir -p "$RUNNER_TEMP/splits"
          cp build/app/outputs/flutter-apk/app-*-release.apk "$RUNNER_TEMP/splits/"
          # The universal APK stays for a device whose ABI is not listed.
          flutter build apk --release "${args[@]}"
      - name: Package
        run: |
          universal="camwatch-$VERSION-android.apk"
          cp apps/camwatch/build/app/outputs/flutter-apk/app-release.apk "$universal"
          sha256sum "$universal" > "$universal.sha256"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            asset="camwatch-$VERSION-android-$abi.apk"
            cp "$RUNNER_TEMP/splits/app-$abi-release.apk" "$asset"
            sha256sum "$asset" > "$asset.sha256"
          done
          ls -l camwatch-"$VERSION"-android*.apk*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: app-android
          path: |
            camwatch-${{ needs.release.outputs.version }}-android*.apk
            camwatch-${{ needs.release.outputs.version }}-android*.apk.sha256
          if-no-files-found: error
          retention-days: 1

  # The only job besides `release` that writes: no checkout, no build, nothing of
  # the repository runs here. It attaches what the builds uploaded, and runs
  # even when one platform failed, so the files that built are there; it
  # publishes the release only when all did.
  attach:
    name: Attach to the release
    needs: [release, app-windows, app-android]
    if: ${{ !cancelled() && needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: app-*
          path: dist
          merge-multiple: true
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
      # Latest only when no newer release is out: a draft rebuilt after a
      # newer one shipped never takes "latest" from it.
      - name: Publish
        if: needs.app-windows.result == 'success' && needs.app-android.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft --repo "$GITHUB_REPOSITORY")
          [ "$draft" = true ] || exit 0
          newest=$(gh release list --exclude-drafts --limit 100 --json tagName --jq '.[].tagName' \
            --repo "$GITHUB_REPOSITORY" | sort -V | tail -1)
          latest=false
          if [ "$(printf '%s\n%s\n' "$newest" "$TAG" | sort -V | tail -1)" = "$TAG" ]; then
            latest=true
          fi
          gh release edit "$TAG" --draft=false --latest="$latest" --repo "$GITHUB_REPOSITORY"
